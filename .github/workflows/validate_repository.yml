name: Validate publication repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Python syntax gate
        run: |
          python -m compileall -q scripts tests

      - name: Shell syntax gate
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            echo "Parsing $f"
            bash -n "$f"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Native R parse gate
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            echo "Parsing $f"
            Rscript -e 'args <- commandArgs(TRUE); parse(file=args[1])' "$f"
          done < <(find scripts -type f -name '*.R' -print0)

      - name: Validate headline manuscript claims
        run: |
          python tests/validate_claims.py

      - name: Verify repository checksums
        shell: bash
        run: |
          if [ -f checksums/SHA256SUMS ]; then
            sha256sum -c checksums/SHA256SUMS
          else
            echo "SHA256SUMS not yet present; checksum validation skipped."
          fi
